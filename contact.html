<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Ruth's Portfolio</title>
    <meta name="description"
        content="Contact Ruth through her accessible portfolio contact form.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="page-header">
        <h1>Contact Me</h1>
        <button id="themeToggle" type="button" aria-label="Toggle dark mode">
            🌙 Dark Mode
        </button>
    </header>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section class="contact-grid">

            <div class="contact-info">
                <h2>Get In Touch</h2>
                <p>
                    Have a question or want to connect? Use the form
                    to send a message.
                </p>

                <p><strong>Email:</strong> ruth@example.com</p>
            </div>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required></textarea>
                </div>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; <span id="year"></span> Ruth. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
