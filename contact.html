<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact - Ruth's Portfolio</title>

    <meta name="description"
          content="Contact Ruth through the accessible portfolio contact form.">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

          <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Contact Me</h1>
    </header>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section>
            <h2>Get In Touch</h2>

            <form action="#" method="post">

                <div>
                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>
                </div>

                <div>
                    <label for="message">Message:</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        required></textarea>
                </div>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; <span id="year"></span>Ruth. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
